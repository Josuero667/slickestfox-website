    <!-- Normalize mute button icon text across browsers/pages -->
    <script>
    (function(){
      function setMuteIcon(){
        var btn = document.getElementById('mute-btn');
        if (!btn) return;
        try {
          var m = localStorage.getItem('siteAudioMuted') === '1';
          var v = parseFloat(localStorage.getItem('siteAudioVolume') || '0.5');
          if (isNaN(v)) v = 0.5;
          btn.textContent = (m || v === 0) ? String.fromCodePoint(0x1F507) : String.fromCodePoint(0x1F50A);
        } catch { btn.textContent = String.fromCodePoint(0x1F507); }
      }
      document.addEventListener('DOMContentLoaded', function(){
        setMuteIcon();
        var btn = document.getElementById('mute-btn');
        if (!btn) return;
        var obs = new MutationObserver(setMuteIcon);
        obs.observe(btn, { childList: true, characterData: true, subtree: true });
        window.addEventListener('storage', setMuteIcon);
      });
    })();
    </script>

	<!-- Background Audio Script (with saved prefs + first-gesture autoplay) -->
	<script>
	(() => {
		const LS_MUTE_KEY = 'siteAudioMuted';
		const LS_VOL_KEY = 'siteAudioVolume';
		let audioEl = null;

        const ICON_MUTED = String.fromCodePoint(0x1F507);
        const ICON_LOUD  = String.fromCodePoint(0x1F50A);
		// Inline JSON with loop sources
		let data = {};
		try { data = JSON.parse(document.getElementById("loop-data").textContent); } catch {}
		const loops = Array.isArray(data.loops) ? data.loops : [];

		const loadPrefs = () => {
			let muted = true, vol = 0.5;
			try {
				const m = localStorage.getItem(LS_MUTE_KEY);
				const v = localStorage.getItem(LS_VOL_KEY);
				if (m !== null) muted = (m === '1');
				if (v !== null) { const nv = Math.max(0, Math.min(1, parseFloat(v))); if (!Number.isNaN(nv)) vol = nv; }
			} catch {}
			return { muted, vol };
		};
		const saveMute = (m) => { try { localStorage.setItem(LS_MUTE_KEY, m ? '1' : '0'); } catch {} };
		const saveVol  = (v) => { try { localStorage.setItem(LS_VOL_KEY, String(v)); } catch {} };

		document.addEventListener("DOMContentLoaded", ()=>{
			if (!loops.length) return;
			const src = loops[Math.floor(Math.random() * loops.length)].src;

			// create <audio>
			audioEl = new Audio(src);
			audioEl.loop = true;
			const { muted, vol } = loadPrefs();
			audioEl.volume = vol;
			audioEl.muted = muted;
			audioEl.play().catch(()=>{});

			// If unmuted but autoplay blocked, start on first user gesture
			const onFirstGesture = () => {
				if (!audioEl) return;
				if (!audioEl.muted && audioEl.paused){ audioEl.play().catch(()=>{}); }
				window.removeEventListener('pointerdown', onFirstGesture);
				window.removeEventListener('keydown', onFirstGesture);
			};
			window.addEventListener('pointerdown', onFirstGesture, { once:false, passive:true });
			window.addEventListener('keydown', onFirstGesture, { once:false });

			// create controls
			const controls = document.createElement("div");
			controls.id = "music-controls";

			const btn = document.createElement("button");
			btn.id = "mute-btn";
                btn.textContent = (audioEl.muted || audioEl.volume == 0) ? ICON_MUTED : ICON_LOUD;

			const slider = document.createElement("input");
			slider.type = "range";
			slider.id = "volume-slider";
			slider.min = "0"; slider.max = "1"; slider.step = "0.01";
			slider.value = String(vol);

			// toggle mute/unmute
			btn.addEventListener("click", ()=>{
				if (!audioEl) return;
				audioEl.muted = !audioEl.muted;
				saveMute(audioEl.muted);
                btn.textContent = (audioEl.muted || audioEl.volume == 0) ? ICON_MUTED : ICON_LOUD;
				if (!audioEl.muted && audioEl.paused){
					audioEl.play().catch(()=>{});
				}
			});

			// adjust volume
			slider.addEventListener("input", ()=>{
				if (!audioEl) return;
				const v = Math.max(0, Math.min(1, parseFloat(slider.value)));
				audioEl.volume = v;
				saveVol(v);
                btn.textContent = (audioEl.muted || audioEl.volume == 0) ? ICON_MUTED : ICON_LOUD;
			});

			// listen for other tabs
			window.addEventListener('storage', (e)=>{
				if (!audioEl) return;
				if (e.key === LS_MUTE_KEY && e.newValue != null) {
					audioEl.muted = (e.newValue === '1');
                btn.textContent = (audioEl.muted || audioEl.volume == 0) ? ICON_MUTED : ICON_LOUD;
					if (!audioEl.muted && audioEl.paused){ audioEl.play().catch(()=>{}); }
				}
				if (e.key === LS_VOL_KEY && e.newValue != null) {
					const v = Math.max(0, Math.min(1, parseFloat(e.newValue)));
					if (!Number.isNaN(v)) { audioEl.volume = v; slider.value = String(v); }
                btn.textContent = (audioEl.muted || audioEl.volume == 0) ? ICON_MUTED : ICON_LOUD;
				}
			});

			controls.appendChild(btn);
			controls.appendChild(slider);
			document.body.appendChild(controls);
		});
	})();
	</script>

    <!-- Simple renderer for posts -->
    <script>
    (() => {
        const el = document.getElementById('posts-list');
        if (!el) return;
        // Local wave wrapper for dynamically-created titles
        function wrapWave(el){
          if (!el) return;
          // If already processed, skip
          if (el.classList.contains('wave') || el.querySelector('.char')) return;
          const text = el.textContent;
          el.textContent = '';
          el.classList.add('wave');
          let idx = 0;
          for (let i=0; i<text.length; i++){
            const ch = text[i];
            if (ch === ' '){ el.appendChild(document.createTextNode(' ')); continue; }
            const span = document.createElement('span');
            span.className = 'char';
            span.style.setProperty('--i', idx++);
            span.textContent = ch;
            el.appendChild(span);
          }
        }
        // Prefer external JSON; fallback to inline #posts-data
        const loadPosts = async () => {
          try {
            const r = await fetch('assets/data/posts.json', { cache: 'no-store' });
            if (r.ok) {
              const j = await r.json();
              if (j && Array.isArray(j.posts)) return j.posts;
            }
          } catch {}
          try {
            const txt = document.getElementById('posts-data')?.textContent || '';
            const j = JSON.parse(txt);
            if (j && Array.isArray(j.posts)) return j.posts;
          } catch {}
          return [];
        };

        const fmtDate = (iso) => {
            if (!iso) return '';
            const d = new Date(iso);
            return isNaN(d) ? iso : d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        };

        const escapeHTML = (str) => String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const linkify = (text) => {
          const s = escapeHTML(text||'');
          const re = /(https?:\/\/[^\s<>'\"]+)/g;
          return s.replace(re, (m)=>'<a href="'+m+'" target="_blank" rel="noopener noreferrer">'+m+'</a>');
        };
        const formatRich = (text) => {
          // Start escaped, then allow a tiny whitelist via bracket tags
          let html = escapeHTML(text||'');
          // [b]...[/b]
          html = html.replace(/\[b\]([\s\S]*?)\[\/b\]/gi, '<strong>$1<\/strong>');
          // [small]...[/small]
          html = html.replace(/\[small\]([\s\S]*?)\[\/small\]/gi, '<small>$1<\/small>');
          // [color=#hex]...[/color]
          html = html.replace(/\[color=\s*(#[0-9a-fA-F]{3,6})\s*\]([\s\S]*?)\[\/color\]/gi, '<span style="color:$1">$2<\/span>');
          // URLs to links
          html = html.replace(/(https?:\/\/[^\s<>'\"]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1<\/a>');
          // Preserve newlines
          html = html.replace(/\n/g, '<br>');
          return html;
        };

        const render = (posts) => {
        // newest first
        posts.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        const frag = document.createDocumentFragment();
        posts.forEach(p => {
            // Luna window container
            const win = document.createElement('div');
            win.className = 'luna-window post';
            win.style.margin = '0';

            // Optional size handling
            if (p.size === 'small')      win.classList.add('size-small');
            else if (p.size === 'medium')win.classList.add('size-medium');
            else if (p.size === 'tall')  win.classList.add('size-tall');
            else if (p.size === 'wide')  win.classList.add('wide');

            if (p.maxWidth != null) {
              const v = (typeof p.maxWidth === 'number') ? (p.maxWidth + 'px') : String(p.maxWidth);
              win.style.maxWidth = v;
            }

            // Titlebar with controls
            const titlebar = document.createElement('div');
            titlebar.className = 'luna-titlebar';
            const title = document.createElement('span');
            title.className = 'luna-title';
            title.textContent = p.title || 'Untitled';
            wrapWave(title);
            titlebar.appendChild(title);

            const controls = document.createElement('div');
            controls.className = 'luna-controls';
            const btnMin = document.createElement('button'); btnMin.className = 'luna-btn minimize'; btnMin.title = 'Minimize'; btnMin.ariaLabel = 'Minimize';
            const btnMax = document.createElement('button'); btnMax.className = 'luna-btn maximize'; btnMax.title = 'Maximize'; btnMax.ariaLabel = 'Maximize';
            const btnClose = document.createElement('button'); btnClose.className = 'luna-btn close'; btnClose.title = 'Close'; btnClose.ariaLabel = 'Close';
            controls.append(btnMin, btnMax, btnClose);
            titlebar.appendChild(controls);
            win.appendChild(titlebar);

            // Decorative frame
            const frame = document.createElement('div');
            frame.className = 'luna-frame';
            frame.setAttribute('aria-hidden','true');
            win.appendChild(frame);

            // Toolbar (date, etc.)
            const toolbar = document.createElement('div');
            toolbar.className = 'luna-toolbar';
            // Date chip
            const dateChip = document.createElement('div');
            dateChip.className = 'tool-chip tool-date';
            dateChip.textContent = fmtDate(p.date);
            toolbar.appendChild(dateChip);
            // Spacer to push icons right if needed
            toolbar.appendChild(Object.assign(document.createElement('div'),{className:'spacer'}));
            // Tag chips: one per tag with a random icon (if tags exist)
            const icons = [
              { key:'paw',     title:'Paw',     src:'assets/ui/luna/icons/paw.png' },
              { key:'bone',    title:'Bone',    src:'assets/ui/luna/icons/bone.png' },
              { key:'star',    title:'Star',    src:'assets/ui/luna/icons/star.png' },
              { key:'camera',  title:'Camera',  src:'assets/ui/luna/icons/camera.png' },
              { key:'music',   title:'Music',   src:'assets/ui/luna/icons/music.png' },
              { key:'sparkle', title:'Sparkle', src:'assets/ui/luna/icons/sparkle.png' }
            ];
            if (Array.isArray(p.tags) && p.tags.length){
              p.tags.forEach((tag, idx) => {
                const ic = icons[(Math.random()*icons.length)|0];
                const chip = document.createElement('div');
                chip.className = 'tool-chip tool-tag';
                const img = document.createElement('img');
                img.width = 16; img.height = 16;
                img.loading = 'lazy'; img.decoding = 'async';
                img.src = ic.src; img.alt = ic.title;
                img.addEventListener('error', ()=>{
                  const ph = document.createElement('span');
                  ph.textContent = ic.title ? ic.title[0].toUpperCase() : '?';
                  ph.style.cssText = 'display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;font:700 11px/16px Ari,system-ui;background:rgba(255,255,255,0.08);';
                  img.replaceWith(ph);
                }, { once:true });
                const label = document.createElement('span');
                label.className = 'tag-text';
                label.textContent = String(tag);
                chip.append(img, label);
                toolbar.appendChild(chip);
              });
            }
            win.appendChild(toolbar);

            // Body
            const body = document.createElement('div');
            body.className = 'luna-body';

            // Media helpers
            const isVideoFile = (u) => /\.(mp4|webm|ogg)(\?|#|$)/i.test(String(u||''));
            const ytIdFrom = (url) => {
              const s = String(url||'').trim();
              // raw ID
              if (/^[\w-]{11}$/.test(s)) return s;
              try {
                const u = new URL(s);
                if (u.hostname.includes('youtu.be')) return u.pathname.slice(1);
                if (u.hostname.includes('youtube.com')){
                  if (u.searchParams.get('v')) return u.searchParams.get('v');
                  const m = u.pathname.match(/\/embed\/([\w-]{11})/); if (m) return m[1];
                }
              } catch {}
              return '';
            };
            const addImage = (src, alt) => {
              const img = document.createElement('img');
              img.className = 'luna-img';
              img.src = src;
              img.alt = alt || 'image';
              img.loading = 'lazy';
              img.decoding = 'async';
              img.style.margin = '10px 0';
              body.appendChild(img);
            };
            const addVideo = (src, opts={}) => {
              const id = ytIdFrom(src);
              if (id){
                const wrap = document.createElement('div');
                wrap.className = 'aspect-16x9';
                wrap.style.margin = '10px 0';
                const iframe = document.createElement('iframe');
                iframe.loading = 'lazy';
                iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
                iframe.referrerPolicy = 'strict-origin-when-cross-origin';
                iframe.src = `https://www.youtube.com/embed/${id}`;
                wrap.appendChild(iframe);
                body.appendChild(wrap);
                return;
              }
              if (isVideoFile(src)){
                const video = document.createElement('video');
                video.controls = true;
                video.playsInline = true;
                if (opts.loop) video.loop = true;
                if (opts.muted) video.muted = true;
                if (opts.autoplay) { video.autoplay = true; video.muted = true; }
                if (opts.poster) video.poster = opts.poster;
                video.src = src;
                video.style.width = '100%';
                video.style.display = 'block';
                video.style.margin = '10px 0';
                body.appendChild(video);
              }
            };
            const addAudio = (src) => {
              if (!src) return;
              const audio = document.createElement('audio');
              audio.controls = true;
              audio.preload = 'none';
              audio.src = src;
              audio.style.display = 'block';
              audio.style.width = '100%';
              audio.style.margin = '6px 0 10px 0';
              body.appendChild(audio);
            };

            // Render media by preference: video > image(s) > gif (gif is just image)
            if (p.video) {
              addVideo(p.video, { loop: !!p.loop, muted: !!p.muted, autoplay: !!p.autoplay, poster: p.poster });
            }
            // Multiple images array
            if (Array.isArray(p.images)) {
              p.images.forEach((u)=>{ if (u) addImage(String(u), p.title || 'post image'); });
            }
            // Single image fallback
            if (p.image) { addImage(p.image, p.title || 'post image'); }
            if (p.gif && !p.image) { // gif is an image; if both provided, image already handled
              addImage(p.gif, p.title || 'gif');
            }
            // Optional audio
            if (p.audio) { addAudio(p.audio); }

            if (p.content) {
                const para = document.createElement('p');
                para.className = 'post-text';
                para.style.whiteSpace = 'pre-wrap';
                para.innerHTML = formatRich(p.content);
                body.appendChild(para);
            }
            // Extra paragraphs to emphasize height for 'tall' demo
            if (p.size === 'tall') {
              const p2 = document.createElement('p');
              p2.textContent = 'More details: plenty of room for multi-paragraph updates, notes, or image-and-text combos. The border tiles repeat cleanly as the post grows.';
              const p3 = document.createElement('p');
              p3.textContent = 'Tip: use tags to categorize posts. Icons will render if available; otherwise a letter placeholder appears.';
              body.append(p2, p3);
            }

            win.appendChild(body);
            frag.appendChild(win);
        });

        if (!posts.length) {
            const empty = document.createElement('p');
            empty.className = 'muted';
            empty.textContent = 'No dog posts yet.';
            frag.appendChild(empty);
        }

        el.innerHTML = '';
        el.appendChild(frag);
        };

        // Kickoff
        loadPosts().then(render).catch(() => render([]));
    })();
    </script>

    <!-- Titlebar button SFX (per-button, overlapping, on press) -->
    <script>
    (function(){
      const SOURCES = {
        minimize: 'assets/ui/luna/minimize.mp3',
        maximize: 'assets/ui/luna/maximize.mp3',
        close:    'assets/ui/luna/close.mp3',
        default:  'assets/ui/luna/click.mp3'
      };
      const cache = new Map();
      const LS_MUTE_KEY = 'siteAudioMuted';
      const LS_VOL_KEY  = 'siteAudioVolume';
      function getGlobal(){
        let muted = false, vol = 1;
        try {
          const m = localStorage.getItem(LS_MUTE_KEY);
          const v = localStorage.getItem(LS_VOL_KEY);
          if (m !== null) muted = (m === '1');
          if (v !== null) { const nv = parseFloat(v); if (!Number.isNaN(nv)) vol = Math.max(0, Math.min(1, nv)); }
        } catch {}
        return { muted, vol };
      }
      function getAudio(key){
        const src = SOURCES[key] || SOURCES.default;
        if (!cache.has(src)){
          try {
            const a = new Audio(src);
            a.preload = 'auto';
            a.volume = 0.6; // base SFX level, scaled by global vol
            cache.set(src, a);
          } catch { cache.set(src, null); }
        }
        return cache.get(src);
      }
      function playKey(key){
        const { muted, vol } = getGlobal();
        if (muted || vol === 0) return;
        const base = getAudio(key);
        if (!base) return;
        try {
          const inst = base.cloneNode(true);
          inst.volume = base.volume * vol;
          inst.play().catch(()=>{});
        } catch {}
      }
      window.addEventListener('DOMContentLoaded', () => {
        document.body.addEventListener('pointerdown', (e) => {
          const btn = e.target.closest('.luna-btn');
          if (!btn) return;
          if (btn.classList.contains('minimize')) return playKey('minimize');
          if (btn.classList.contains('maximize')) return playKey('maximize');
          if (btn.classList.contains('close'))    return playKey('close');
          playKey('default');
        }, { passive: true });
      });
    })();
    </script>

    <!-- Optional: title wave effect for dog posting titles -->
    <script>

        const text = el.textContent;

        el.classList.add('wave');
        let idx = 0;
        for (let i=0; i<text.length; i++){
          const ch = text[i];
          if (ch === ' '){ el.appendChild(document.createTextNode(' ')); continue; }
          const span = document.createElement('span');
          span.className = 'char';
          span.style.setProperty('--i', idx++);
          span.textContent = ch;
          el.appendChild(span);
        }
      }
      window.addEventListener('DOMContentLoaded', ()=>{
        document.querySelectorAll('.luna-titlebar .luna-title').forEach(applyWave);
      });
    })();
    </script>
